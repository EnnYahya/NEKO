<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nekko — Create Account</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="paw-field"></div>

<div class="page-center">
  <div class="auth-card">
    <div class="brand">
      <div class="brand-mark"><img src="images/logo-placeholder.png" alt="Nekko logo" onerror="this.style.display='none'; this.parentElement.textContent='N';"></div>
      <h1>Join Nekko</h1>
      <p>Pick a username — no email needed</p>
    </div>

    <div id="banner" class="status-banner"></div>

    <form id="signup-form">
      <div class="field">
        <label for="username">Username</label>
        <input type="text" id="username" placeholder="e.g. nekomen" autocomplete="username" required>
        <div class="field-hint">3-20 characters. Letters, numbers, underscores only.</div>
        <div class="field-error" id="username-error"></div>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="At least 6 characters" autocomplete="new-password" required>
      </div>
      <div class="field">
        <label for="password2">Confirm Password</label>
        <input type="password" id="password2" placeholder="Type it again" autocomplete="new-password" required>
      </div>
      <button type="submit" class="btn" id="signup-btn">Create Account</button>
    </form>

    <div class="links-row" style="justify-content:center;">
      <span>Already have an account? <a href="index.html">Log in</a></span>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/auth.js"></script>
<script>
  const form = document.getElementById("signup-form");
  const banner = document.getElementById("banner");
  const btn = document.getElementById("signup-btn");
  const usernameError = document.getElementById("username-error");

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    banner.className = "status-banner";
    usernameError.className = "field-error";

    const username = document.getElementById("username").value;
    const password = document.getElementById("password").value;
    const password2 = document.getElementById("password2").value;

    if (password !== password2) {
      showBanner(banner, "Passwords don't match.", "error");
      return;
    }

    setLoading(btn, true, "Create Account");
    try {
      await handleSignup(username, password);
      showBanner(banner, "Account created! Redirecting…", "success");
      setTimeout(() => window.location.href = "dashboard.html", 800);
    } catch (err) {
      if (err.message.includes("already taken")) {
        usernameError.textContent = err.message;
        usernameError.className = "field-error show";
      } else {
        showBanner(banner, err.message, "error");
      }
      setLoading(btn, false, "Create Account");
    }
  });
</script>
</body>
</html>
