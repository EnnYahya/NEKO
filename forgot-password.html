<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nekko — Forgot Password</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="paw-field"></div>

<div class="page-center">
  <div class="auth-card">
    <div class="brand">
      <div class="brand-mark"><img src="images/logo-placeholder.png" alt="Nekko logo" onerror="this.style.display='none'; this.parentElement.textContent='N';"></div>
      <h1>Forgot Password?</h1>
      <p>We'll send a request straight to the admin</p>
    </div>

    <div id="banner" class="status-banner"></div>

    <form id="forgot-form">
      <div class="field">
        <label for="username">Your Username</label>
        <input type="text" id="username" placeholder="e.g. nekomen" required>
        <div class="field-hint">Make sure this matches exactly — this is how the admin finds your account.</div>
      </div>
      <div class="field">
        <label for="note">Anything else? (optional)</label>
        <input type="text" id="note" placeholder="e.g. how to reach you">
      </div>
      <button type="submit" class="btn" id="forgot-btn">Send Request</button>
    </form>

    <div class="links-row" style="justify-content:center;">
      <a href="index.html">Back to log in</a>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/auth.js"></script>
<script>
  const form = document.getElementById("forgot-form");
  const banner = document.getElementById("banner");
  const btn = document.getElementById("forgot-btn");

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    banner.className = "status-banner";
    const username = document.getElementById("username").value;
    const note = document.getElementById("note").value;

    setLoading(btn, true, "Send Request");
    try {
      await handleForgotPassword(username, note);
      showBanner(banner, "Request sent! The admin will reach out to help reset your password.", "success");
      form.reset();
    } catch (err) {
      showBanner(banner, err.message, "error");
    } finally {
      setLoading(btn, false, "Send Request");
    }
  });
</script>
</body>
</html>
