<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nekko — Profile</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="paw-field"></div>

<div class="topbar">
  <div class="topbar-title">
    <div class="brand-mark"><img src="images/logo-placeholder.png" alt="Nekko logo" onerror="this.style.display='none'; this.parentElement.textContent='N';"></div>
    Nekko
  </div>
  <div class="topbar-user">
    <a class="nav-link" href="dashboard.html">🏠 Home</a>
    <a class="nav-link" href="games.html">🎮 Games</a>
    <a class="nav-link" href="chat.html">💬 Chat</a>
    <button id="logout-btn">Log Out</button>
  </div>
</div>

<div class="feed-shell" style="max-width:480px;">
  <div class="composer" id="profile-card" style="text-align:center;">
    <div class="post-avatar" id="profile-avatar" style="width:72px; height:72px; font-size:28px; margin:0 auto 12px;">?</div>
    <h2 id="profile-username" style="margin-bottom:4px;">Loading…</h2>
    <p id="profile-bio" style="opacity:0.75; margin-bottom:16px;"></p>

    <div id="own-profile-controls" style="display:none;">
      <textarea id="bio-input" placeholder="Write a short bio…" maxlength="200" style="margin-bottom:10px;"></textarea>
      <button class="btn" id="save-bio-btn">Save Bio</button>
    </div>

    <div id="other-profile-controls" style="display:none; gap:10px; justify-content:center;">
      <button class="btn" id="message-btn">💬 Message</button>
      <button class="btn btn-secondary" id="chess-btn">♟️ Play Chess</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/auth.js"></script>
<script src="js/chat.js"></script>
<script src="js/chess-engine.js"></script>
<script>
  const params = new URLSearchParams(window.location.search);
  const viewedUid = params.get("uid");

  let currentUser = null;
  let currentProfile = null;
  let viewedProfile = null;

  function showToast(msg) {
    const t = document.getElementById("toast");
    t.textContent = msg;
    t.className = "toast show";
    setTimeout(() => t.className = "toast", 2000);
  }

  function initials(username) {
    return (username || "?").charAt(0).toUpperCase();
  }

  requireLogin(async (user) => {
    currentUser = user;
    const myDoc = await db.collection("users").doc(user.uid).get();
    currentProfile = myDoc.data() || { username: "friend" };

    if (!viewedUid) {
      document.getElementById("profile-username").textContent = "No user specified";
      return;
    }

    const targetDoc = await db.collection("users").doc(viewedUid).get();
    if (!targetDoc.exists) {
      document.getElementById("profile-username").textContent = "User not found";
      return;
    }
    viewedProfile = targetDoc.data();

    document.getElementById("profile-avatar").textContent = initials(viewedProfile.username);
    document.getElementById("profile-username").textContent = viewedProfile.username;
    document.getElementById("profile-bio").textContent = viewedProfile.bio || "No bio yet.";

    if (viewedUid === currentUser.uid) {
      document.getElementById("own-profile-controls").style.display = "block";
      document.getElementById("bio-input").value = viewedProfile.bio || "";
    } else {
      document.getElementById("other-profile-controls").style.display = "flex";
    }
  });

  document.getElementById("save-bio-btn").addEventListener("click", async () => {
    const btn = document.getElementById("save-bio-btn");
    const newBio = document.getElementById("bio-input").value.trim();
    setLoading(btn, true, "Save Bio");
    try {
      await db.collection("users").doc(currentUser.uid).update({ bio: newBio });
      document.getElementById("profile-bio").textContent = newBio || "No bio yet.";
      showToast("Bio updated!");
    } catch (err) {
      showToast(err.message);
    } finally {
      setLoading(btn, false, "Save Bio");
    }
  });

  document.getElementById("message-btn").addEventListener("click", async () => {
    const btn = document.getElementById("message-btn");
    setLoading(btn, true, "💬 Message");
    try {
      const conversationId = await startConversationByUid(currentUser, currentProfile, viewedUid, viewedProfile.username);
      window.location.href = `chat.html?conversation=${conversationId}&with=${encodeURIComponent(viewedProfile.username)}`;
    } catch (err) {
      showToast(err.message);
      setLoading(btn, false, "💬 Message");
    }
  });

  document.getElementById("chess-btn").addEventListener("click", async () => {
    const btn = document.getElementById("chess-btn");
    setLoading(btn, true, "♟️ Play Chess");
    try {
      // Reuse an existing, still-active match against this same person if
      // one exists, instead of spawning a duplicate game every click.
      const existing = await db.collection("chess_matches")
        .where("players", "array-contains", currentUser.uid)
        .where("status", "==", "active")
        .get();
      const match = existing.docs.find(doc => doc.data().players.includes(viewedUid));

      let matchId;
      if (match) {
        matchId = match.id;
      } else {
        const newMatch = await db.collection("chess_matches").add({
          players: [currentUser.uid, viewedUid],
          usernames: {
            [currentUser.uid]: currentProfile.username,
            [viewedUid]: viewedProfile.username
          },
          whiteId: currentUser.uid,
          blackId: viewedUid,
          board: JSON.stringify(createInitialBoard()),
          turn: "w",
          status: "active",
          result: null,
          createdAt: firebase.firestore.FieldValue.serverTimestamp(),
          updatedAt: firebase.firestore.FieldValue.serverTimestamp()
        });
        matchId = newMatch.id;
      }
      window.location.href = `chess.html?match=${matchId}`;
    } catch (err) {
      showToast(err.message);
      setLoading(btn, false, "♟️ Play Chess");
    }
  });

  document.getElementById("logout-btn").addEventListener("click", async () => {
    await handleLogout();
    window.location.href = "index.html";
  });
</script>
</body>
</html>
